name: Dionysius Buhler 
title: Dionysius Buhler
description: Seeking wisdom with Dr Buhler 
about: A new one page directory 

master_repo: false
url: "https://drbuhler.com"
baseurl: "" # Keep this empty if it's the main site root
markdown: kramdown
highlighter: rouge

# author / social info (used by footer icons, about page, copyright)
owner:
  name: "Dionysius (Keith) Buhler"
  avatar: "/images/avatar.png"
  email: "keithedbuhler@gmail.com"
  facebook: "keithedbuhler"
  instagram: "dionysiusbuhler"
  youtube: "https://www.youtube.com/c/KeithBuhler"

# All of these are on the GitHub Pages plugin allow-list.
plugins:
  - jekyll-gist
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# jekyll-seo-tag
lang: en_US
twitter:
  username: dionysiusbuhler
author:
  name: Dionysius Buhler
  twitter: dionysiusbuhler
social:
  name: Dionysius Buhler
  links:
    - https://www.linkedin.com/in/dionysiusbuhler/
    - https://www.youtube.com/channel/UCDxfeT2v6-kFM12T7zD-K9Q
    - https://github.com/drbuhler

logo:             /assets/icons/icon-192.png
disqus_shortname:

rtl: false

# author info
owner:
  name      : "Dionysius (Keith) Buhler"
  avatar    : "/images/avatar.png"
  bio       : "Entrepreneur and philosopher"  
  email     : "dionysiusbuhler@gmail.com"
  url       : "https://www.drbuhler.com"
  facebook  : "drbuhler" 
  github    : "https://github.com/drbuhler"
  twitter   : "dionysiusbuhler"
  youtube   : "https://www.youtube.com/channel/UCDxfeT2v6-kFM12T7zD-K9Q"
  linkedin  : "https://www.linkedin.com/in/dionysiusbuhler/"


  # For Google Authorship https://plus.google.com/authorship
  google_plus:

# Analytics and webmaster tools stuff goes here
google_analytics: UA-71712734-1
google_verify:  
bing_verify:         

analytics:
  provider: "google-universal"
  tracking_id: "UA-71712734-1"

timezone:    America/New_York
future:      true
highlighter: rouge

# Gems

# (old 'gems:' list removed: it silently replaced 'plugins:' above, so the
#  feed and sitemap were never generated. jekyll-archives is not supported on Pages.)
sass:
  sass_dir: _sass
  style: compressed


# For categories and tags
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Links to include in footer navigation

# For external links add external: true
links:
  - title: Home
    url: /
    external: false
    icon: home
  - title: <i class="icon-book"></i> Documentation
    url: /documentation
  - title: Categories
    url: /categories
  - title: Tags
    url: /tags

teaser:   "400x400.gif"
og_image: "db-bw-small.png"

# Outputting

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/



kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

collections:
  papers:
    output: true
  teaching:
    output: true
  presentations:
    output: true

defaults:
  - scope:
      path: "" # empty string for all files
      type: 
    values: 
      layout: "page"
  # default Open Graph / Twitter image (1200x630)
  - scope:
      path: ""
    values:
      image: /images/og-drbuhler.jpg
  # drafts / templates kept out of sitemap.xml
  - scope:
      path: "content/sandbox"
    values:
      sitemap: false
  - scope:
      path: "content/new-style-one-page-website-html-css-project-master"
    values:
      sitemap: false
  - scope:
      path: "content/art"
    values:
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false
  # don't advertise third-party e-book PDFs or personal letters in sitemap.xml
  - scope:
      path: "content/ebooks/*.pdf"
    values:
      sitemap: false
  - scope:
      path: "content/blog/*.pdf"
    values:
      sitemap: false
  - scope:
      path: "posts"
      type: ""
      values:
        layout: "post" # overrides previous default layout
        read_time: false
        comments: true
        share: false
        related: false  
        author_profile: true
        words_per_minute: 200
  - scope:
      path: "slideshows"
      type: "slideshows"
    values:
      layout: "slide"

